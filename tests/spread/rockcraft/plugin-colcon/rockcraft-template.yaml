name: plugin-colcon
base: "@ROCK_BASE@"
build-base: "@BASE@"

version: "0.1"
summary: A ROS 2 rock that builds the @PACKAGE@ talker and listener with colcon.
description: A ROS 2 rock that builds the @PACKAGE@ talker and listener with colcon.
license: GPL-3.0
platforms:
  amd64:
  arm64:

services:
  talker:
    override: replace
    startup: disabled
    command: "/bin/sh -c '. /opt/ros/overlay/setup.sh && exec /opt/ros/overlay/lib/@PACKAGE@/talker'"
    on-failure: shutdown

  listener:
    override: replace
    startup: disabled
    command: "/bin/sh -c '. /opt/ros/overlay/setup.sh && exec /opt/ros/overlay/lib/@PACKAGE@/listener'"
    on-failure: shutdown

package-repositories:
  - type: apt
    url: http://packages.ros.org/ros2/ubuntu
    components: [main]
    suites: ["@SUITE@"]
    key-id: C1CF6E31E6BADE8868B172B4F42ED6FBAB17C654

parts:
  demo-nodes:
    plugin: colcon
    source: https://github.com/ros2/demos.git
    source-branch: "@DISTRO@"
    stage-packages: "@STAGE_PACKAGES@"
    colcon-packages: ["@PACKAGE@"]
    build-environment:
      - ROS_DISTRO: "@DISTRO@"
